name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint (erros graves)
        run: ruff check app.py --select E9,F63,F7,F82
      - name: Compila
        run: python -m py_compile app.py
